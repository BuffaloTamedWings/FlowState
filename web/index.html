<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowState</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #11161c;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .panel {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 280px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        background: rgba(17, 22, 28, 0.88);
        border: 1px solid #333b42;
        border-radius: 8px;
        padding: 12px;
        color: #d9dee3;
        font: 13px/1.4 system-ui, sans-serif;
        z-index: 10;
      }

      .panel-header {
        margin-bottom: 8px;
      }

      .panel-title {
        font-weight: 600;
        font-size: 14px;
      }

      .panel-hint {
        color: #9aa4ad;
        margin-top: 2px;
      }

      .panel-lock-notice {
        display: none;
        background: rgba(208, 64, 64, 0.18);
        border: 1px solid rgba(208, 64, 64, 0.5);
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 8px;
        color: #f2b9b9;
      }

      .panel-options {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 8px;
      }

      .panel-option {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        background: #20262c;
        border: 1px solid #333b42;
        border-radius: 4px;
        color: #d9dee3;
        padding: 6px 8px;
        cursor: pointer;
        font: inherit;
      }

      .panel-option:hover:not(:disabled) {
        background: #2a3138;
      }

      .panel-option-selected {
        border-color: #d8b24a;
        box-shadow: inset 0 0 0 1px #d8b24a;
      }

      .panel-option:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .panel-option-reason {
        font-size: 11px;
        color: #9aa4ad;
        margin-top: 2px;
      }

      .panel-message {
        display: none;
        background: rgba(208, 64, 64, 0.18);
        border: 1px solid rgba(208, 64, 64, 0.5);
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 8px;
        color: #f2b9b9;
        word-break: break-word;
      }

      .panel-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .panel-button {
        background: #343a41;
        border: 1px solid #434a53;
        border-radius: 4px;
        color: #d9dee3;
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
      }

      .panel-button:hover:not(:disabled) {
        background: #3c444c;
      }

      .panel-button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .panel-run {
        background: #2f6b4f;
        border-color: #3c8463;
      }

      .panel-clock {
        margin-left: auto;
        color: #9aa4ad;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
